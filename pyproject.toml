[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ticket-booking-service"
version = "0.1.0"
description = "Concurrency-safe event ticket booking API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0", "uvicorn[standard]>=0.30,<1.0", "sqlalchemy>=2.0,<3.0",
  "psycopg[binary]>=3.2,<4.0", "pydantic-settings>=2.5,<3.0",
  "pwdlib[argon2]>=0.2,<1.0", "PyJWT>=2.9,<3.0", "email-validator>=2.2,<3.0", "alembic>=1.13,<2.0",
  "redis>=5.0,<6.0", "prometheus-client>=0.21,<1.0"
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9.0", "httpx>=0.27,<1.0", "pytest-xdist>=3.6,<4.0", "ruff>=0.9,<1.0"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
